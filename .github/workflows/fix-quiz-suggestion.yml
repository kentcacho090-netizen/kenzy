name: Normalize Quiz Maker suggestion field

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize the real Quiz Maker component
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/KenzyApp.js')
          text = path.read_text(encoding='utf-8')
          original = text

          if "const [suggestion, setSuggestion] = useState('');" not in text:
              text = text.replace(
                  "  const [minutes, setMinutes] = useState(10);\n",
                  "  const [minutes, setMinutes] = useState(10);\n  const [suggestion, setSuggestion] = useState('');\n",
                  1,
              )

          old_fetch = "body: JSON.stringify({ files: encoded, count })"
          new_fetch = "body: JSON.stringify({ files: encoded, count, suggestion: suggestion.trim().slice(0, 1000) })"
          if old_fetch in text:
              text = text.replace(old_fetch, new_fetch, 1)

          marker = "    <div className=\"settings-grid\"><Range label=\"Questions\" value={count} min={1} max={100} onChange={setCount} /><Range label=\"Time limit\" value={minutes} min={1} max={180} suffix=\"min\" onChange={setMinutes} /></div>"
          panel = """    <div id=\"kenzy-quiz-suggestion\" style={{ marginTop: 16, padding: 18, background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 18 }}>
      <div className=\"eyebrow\">OPTIONAL INSTRUCTIONS</div>
      <strong style={{ display: 'block', marginTop: 6, color: 'var(--text)', fontSize: 16 }}>Customize how your quiz is generated</strong>
      <p style={{ margin: '6px 0 12px', color: 'var(--muted)', lineHeight: 1.5, fontSize: 13 }}>Specify any additional preferences for difficulty, question format, topics to emphasize, or problem-solving requirements.</p>
      <textarea
        value={suggestion}
        onChange={(event) => setSuggestion(event.target.value.slice(0, 1500))}
        rows={4}
        maxLength={1500}
        placeholder={'Example:\nCreate challenging questions that require problem-solving and critical thinking. Include a balanced mix of conceptual and application-based questions.'}
        aria-label=\"Optional quiz instructions\"
        style={{ width: '100%', boxSizing: 'border-box', resize: 'vertical', minHeight: 105, border: '1px solid var(--border)', borderRadius: 13, padding: 13, background: 'var(--surface2)', color: 'var(--text)', outline: 'none', lineHeight: 1.5, fontFamily: 'inherit' }}
      />
      <div style={{ textAlign: 'right', marginTop: 6, color: 'var(--muted)', fontSize: 11 }}>{suggestion.length}/1500</div>
    </div>
"""

          # Remove every existing suggestion panel between the upload area and settings controls.
          before, sep, after = text.partition(marker)
          if sep:
              cleaned_before = re.sub(
                  r'\n    <div(?: id=\"kenzy-quiz-suggestion\")? style=\{\{ marginTop: 16,.*?(?=\n    <div className=\"settings-grid\">)',
                  '',
                  before,
                  flags=re.DOTALL,
              )
              # If the older inline block uses a different exact shape, remove repeated labeled blocks conservatively.
              cleaned_before = re.sub(
                  r'\n    <div[^>]*>\n      <div className=\"eyebrow\">OPTIONAL (?:SUGGESTION|INSTRUCTIONS)</div>.*?(?=\n    <div className=\"settings-grid\">)',
                  '',
                  cleaned_before,
                  flags=re.DOTALL,
              )
              text = cleaned_before + panel + sep + after

          if text != original:
              path.write_text(text, encoding='utf-8')
          else:
              print('No normalization needed.')
          PY

      - name: Check source syntax
        shell: bash
        run: |
          node --check src/KenzyApp.js

      - name: Commit normalization when needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/KenzyApp.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Normalize quiz instructions UI"
          git push
